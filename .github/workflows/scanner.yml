name: Stock scanner

on:
  schedule:
    # Every 30 min, Mon-Fri, 12:00-21:59 UTC. covers 08:30-16:xx ET in both EST and EDT.
    # cloud_run.py decides what is actually due from US Eastern time.
    - cron: "*/30 12-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now regardless of time"
        type: choice
        options: ["", "scan", "summary", "all", "export"]
        default: ""

concurrency:
  group: stock-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # results/ (scan history, alert de-dup, LINE dedupe) is kept in the private
      # Actions cache - never published - so portfolio data stays off the public site.
      - name: Restore saved results
        uses: actions/cache/restore@v4
        with:
          path: results
          key: results-${{ github.run_id }}
          restore-keys: results-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run scanners
        id: scan
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
          PORTFOLIO_CSV: ${{ secrets.PORTFOLIO_CSV }}
          ACCOUNT_SIZE_USD: ${{ secrets.ACCOUNT_SIZE_USD }}
        run: |
          if [ -n "${{ inputs.force }}" ]; then
            python cloud_run.py --force "${{ inputs.force }}"
          else
            python cloud_run.py
          fi

      - name: Save results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results
          key: results-${{ github.run_id }}

      - name: Export public market data
        if: always()
        run: python export_data.py

      # Market data only (no shares, costs or tokens) goes to gh-pages/data/latest.json
      # for the online dashboard. The full dashboard is published only encrypted, and only
      # when DASHBOARD_PASSWORD is set.
      - name: Build site
        if: always()
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          rm -rf publish && mkdir -p publish/data
          cp results/public_latest.json publish/data/latest.json
          if [ -n "$DASHBOARD_PASSWORD" ] && [ -f results/dashboard.html ]; then
            npx --yes staticrypt@3 results/dashboard.html -p "$DASHBOARD_PASSWORD" \
              -d publish --short --remember 30 --config false \
              --template-title "Stock Dashboard" --template-instructions "ใส่รหัสผ่านเพื่อดูพอร์ต"
            mv publish/dashboard.html publish/index.html
          else
            echo '<meta charset="utf-8"><p>Stock scanner data: <a href="data/latest.json">data/latest.json</a></p>' > publish/index.html
          fi
          touch publish/.nojekyll

      - name: Publish to gh-pages
        if: always()
        run: |
          cd publish
          git init -q
          git checkout -q -b gh-pages
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # cloud_run.py already reports its own crashes; this covers every other failed step
      - name: Alert on failure
        if: failure() && steps.scan.outcome != 'failure'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install -q requests python-dotenv || true
          python -c "import notify; notify.send('⚠️ Stock scanner workflow failed - ดูแท็บ Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}', priority=True)" || true
